
name: Quick Chat Java CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download JUnit dependencies
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar -o junit.jar
          curl -fsSL https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar -o hamcrest-core.jar

      - name: Compile Java source and test files
        run: |
          mkdir -p build/ci-classes
          find src test -name "*.java" -print0 | xargs -0 javac -cp "junit.jar:hamcrest-core.jar" -d build/ci-classes

      - name: Run Message unit tests
        run: |
          java -cp "build/ci-classes:junit.jar:hamcrest-core.jar" org.junit.runner.JUnitCore poe_part1.MessageTest

      - name: Run Login unit tests
        run: |
          java -cp "build/ci-classes:junit.jar:hamcrest-core.jar" org.junit.runner.JUnitCore poe_part1.LoginTest
